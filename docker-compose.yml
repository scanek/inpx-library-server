services:
  library:
    image: ghcr.io/scanek/inpx-library-server:latest
    container_name: inpx-library
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - /path/to/books:/library:ro
    environment:
      - PORT=3000
      - LIBRARY_ROOT=/library
